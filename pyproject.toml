[build-system] # 프로젝트 빌드 도구를 설정한다.
requires = ["setuptools>=68"] # 빌드에 필요한 setuptools 버전을 지정한다.
build-backend = "setuptools.build_meta" # setuptools의 표준 빌드 기능을 사용한다.

[project] # 프로젝트 기본 정보를 설정한다.
name = "idscanner" # 패키지 이름을 지정한다.
version = "0.1.0" # 현재 프로젝트 버전을 지정한다.
description = "신분증 정보 인식 및 검토 데스크톱 프로그램" # 프로젝트 설명을 지정한다.
readme = "README.md" # 프로젝트 소개 문서를 지정한다.
requires-python = ">=3.12,<3.13" # Python 3.12 버전대를 사용한다.
dependencies = [ # 앱 실행에 필요한 라이브러리를 지정한다.
    "PySide6==6.10.1", # 데스크톱 화면을 구성한다.
    "paddlepaddle==3.3.0", # OCR 모델을 실행할 연산 엔진을 설치한다.
    "paddleocr==3.3.3", # 글자 검출과 인식 기능을 설치한다.
] # 의존성 목록을 마친다.

[project.gui-scripts] # 데스크톱 앱 실행 명령을 설정한다.
idscanner = "idscanner.__main__:main" # idscanner 명령을 main 함수에 연결한다.

[tool.setuptools.packages.find] # 설치할 Python 패키지의 검색 위치를 설정한다.
where = ["src"] # src 아래에서 패키지를 찾는다.

[tool.ruff] # 이후 사용할 코드 검사·포맷 도구의 기준을 설정한다.
target-version = "py312" # Python 3.12 문법을 기준으로 검사한다.
line-length = 88 # 코드 줄 길이의 기준을 지정한다.
